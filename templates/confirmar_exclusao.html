{% extends "base.html" %}
{% block content %}
    <form action="/excluir/{{ tarefa.idtarefa }}" methods="post">  
        <h2 class="text-xl font-bold">Excluir esta tarefa?</h2>
        <p>{{ tarefa.nome_tarefa }}</p>
        <button type="submit"
          class="w-full bg-red-600 text-white rounded-lg p-3">Sim, excluir
        </button>
        <a href="/" class="block text-center underline">Cancelar</a>
    </form>
{% endblock %}
